# 배포용 secrets 템플릿 (실제 값은 여기 적지 말 것 — 문서용)
#
# 이 값들은 두 군데에 넣는다:
#   1) 로컬 테스트: .streamlit/secrets.toml  (git에 안 올라감)
#   2) 배포: Streamlit Community Cloud 앱 설정 → Settings → Secrets 칸에 붙여넣기
#
# DATABASE_URL 이 있으면 그 클라우드 DB(Postgres)를 쓰고, 없으면 로컬 SQLite 파일을 쓴다.

# Supabase → Project Settings → Database → Connection string (URI). 비밀번호 포함.
DATABASE_URL = "postgresql://postgres:<비밀번호>@<호스트>:5432/postgres"

# 앱에 접속할 때 물어볼 비밀번호 (아무 문자열이나 정하면 됨)
APP_PASSWORD = "여기에-원하는-비밀번호"
